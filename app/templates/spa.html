<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GymTune — AI Fitness Intelligence</title>
  <meta name="description" content="AI-powered fitness tracking with ML dropout prediction and analytics." />

  <!--
    Tailwind CSS (Play CDN)
    For production: run `npx tailwindcss -o app/static/dist/tailwind.css --minify`
    then replace this tag with:
    <link rel="stylesheet" href="/static/dist/tailwind.css">
  -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <!-- esbuild extracted CSS (range slider styles etc.) -->
  <link rel="stylesheet" href="/static/dist/bundle.css" />

  <!-- Inter from Google Fonts — preconnect first for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
    * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    /* Prevent flash of unstyled content */
    #root:empty { display: none; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
  <div id="root"></div>
  <!-- React bundle produced by esbuild -->
  <script src="/static/dist/bundle.js"></script>
</body>
</html>
